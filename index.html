<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramey Elizabeth | Cyber Spatial Matrix 3D</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Ambient Glowing Light Orbs -->
  <div class="ambient-orb cyan-orb"></div>
  <div class="ambient-orb magenta-orb"></div>
  <div class="ambient-orb gold-orb"></div>

  <!-- 3D Gold & Cyan Grid Floor -->
  <div class="grid-floor"></div>

  <!-- Unboxed Spatial Canvas -->
  <div class="spatial-canvas">

    <!-- Central Orb of Power Core -->
    <header class="center-core">
      <div class="orb-wrapper">
        <img src="orb_of_power_3d.png" alt="Orb of Power" class="orb-3d-img">
        <div class="orb-glow-ring"></div>
      </div>
      <h1 class="neon-title">&lt;hello_universe /&gt;</h1>
      <p class="tagline">Full-Stack Developer | Ex-SaaS Sales</p>
    </header>

    <!-- Floating 2x2 Spatial Nodes -->
    <main class="spatial-grid">

      <!-- LinkedIn Node -->
      <a href="https://www.linkedin.com/in/ramey-l-b30361347" target="_blank" class="spatial-node node-cyan">
        <div class="node-icon-wrapper">
          <img src="linkedin_tech_glow_3d.png" alt="LinkedIn Tech Glow" class="node-3d-img">
        </div>
        <div class="node-info">
          <h2>LinkedIn</h2>
          <span class="node-sub">Tech Glow</span>
        </div>
      </a>

      <!-- Projects Node -->
      <a href="#" class="spatial-node node-gold">
        <div class="node-icon-wrapper">
          <img src="octocat_projects_3d.png" alt="Octocat Projects" class="node-3d-img">
        </div>
        <div class="node-info">
          <h2>Projects</h2>
          <span class="node-sub">Code Showcase</span>
        </div>
      </a>

      <!-- freeCodeCamp Node -->
      <a href="https://www.freecodecamp.org/rameyelizabeth" target="_blank" class="spatial-node node-magenta">
        <div class="node-icon-wrapper">
          <img src="fcc_campfire_3d.png" alt="freeCodeCamp Streak" class="node-3d-img">
        </div>
        <div class="node-info">
          <h2>freeCodeCamp</h2>
          <span class="node-sub">Campfire & Code</span>
        </div>
      </a>

      <!-- Hockey & Fitness Node -->
      <div class="spatial-node node-cyan">
        <div class="node-icon-wrapper">
          <img src="hockey_fitness_3d.png" alt="Hockey and Fitness" class="node-3d-img">
        </div>
        <div class="node-info">
          <h2>Hockey & Fitness</h2> 
          <span class="node-sub">Game Day Hype & Schedules</span>
      <!--Dual Team Links-->
          <div class="Team-Links">
          <a href="https://www.nhl.com/lightning/schedule">⚡ Bolts</a> 
          <a href="https://www.nhl.com/devils/schedule">😈 Devils</a> 
          </div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="matrix-footer">
      <p>&lt;spatial_matrix_v3.0 /&gt; | Powered by 3D Assets & CSS</p>
    </footer>

  </div>

</body>

</html>
